[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API and needs GEMINI_API_KEY. Run with: uv run pytest -m live"]
# The live test is left out of the default run, so the tests never spend the free quota by accident.
addopts = "-m 'not live'"
